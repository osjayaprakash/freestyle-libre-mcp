name: PyPI

# Push a tag like v0.1.1 (matching the version in pyproject.toml) to publish.
# Needs the PYPI_API_TOKEN repository secret.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches pyproject version
        if: github.ref_type == 'tag'
        run: |
          version=$(uv version --short)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv build
      # --check-url skips files already on PyPI, so re-runs are safe.
      - run: uv publish --check-url https://pypi.org/simple/
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
