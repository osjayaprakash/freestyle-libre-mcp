[project]
name = "freestyle-libre-mcp"
version = "0.1.0"
description = "MCP server exposing FreeStyle Libre glucose readings from LibreLinkUp"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.5,<3",
    "mcp>=2.2,<3",
    "pydantic>=2.12,<3",
]

[project.urls]
Homepage = "https://github.com/osjayaprakash/freestyle-libre-mcp"
Issues = "https://github.com/osjayaprakash/freestyle-libre-mcp/issues"

[project.optional-dependencies]
langfuse = ["langfuse>=4,<5"]

[project.scripts]
freestyle-libre-mcp = "librelinkup_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/librelinkup_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = ["live: calls the real LibreLinkUp API (needs LIBRELINKUP_EMAIL/PASSWORD)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
